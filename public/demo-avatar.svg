<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />
  <!-- Head -->
  <circle cx="100" cy="75" r="38" fill="url(#avatarGrad)" />
  <!-- Body / Shoulders -->
  <path d="M40 180 C40 135, 70 120, 100 120 C130 120, 160 135, 160 180 Z" fill="url(#avatarGrad)" opacity="0.95" />
  <!-- Subtle border ring -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.2" />
</svg>
